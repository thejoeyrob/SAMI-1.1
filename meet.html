<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020504">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Meet SAMI · Spatial Analysis Mapping Intelligence</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.f8bcaf6fed.png">
  <link rel="stylesheet" href="launch-v103.css">
</head>
<body>
  <main id="launchFilm" class="launch-film" aria-label="SAMI introduction">
    <div class="ambient-haze haze-a" aria-hidden="true"></div>
    <div class="ambient-haze haze-b" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>

    <div class="launch-controls">
      <button id="launchSound" class="launch-control" type="button" aria-pressed="false">Sound</button>
      <button id="launchSkip" class="launch-control" type="button">Skip intro</button>
    </div>

    <section id="problemScene" class="scene problem-scene" aria-label="The current planning process">
      <div id="matrixField" class="matrix-field" aria-hidden="true"></div>
      <canvas id="rootCanvas" class="root-canvas" aria-hidden="true"></canvas>
      <div id="processWords" class="process-words" aria-hidden="true"></div>
      <div id="impactBloom" class="impact-bloom" aria-hidden="true"></div>
      <div id="pinStage" class="pin-stage" aria-hidden="true">
        <div class="pin-shadow"></div>
        <svg id="mapPin" class="map-pin" viewBox="0 0 80 112" role="presentation">
          <defs>
            <linearGradient id="pinGradient" x1=".16" y1=".04" x2=".82" y2=".96">
              <stop offset="0" stop-color="#b8ffd1"/>
              <stop offset=".46" stop-color="#55f6a5"/>
              <stop offset="1" stop-color="#0ec9c8"/>
            </linearGradient>
          </defs>
          <path class="pin-body" fill="url(#pinGradient)" d="M40 4C20.1 4 4 20.1 4 40c0 27.5 36 67 36 67s36-39.5 36-67C76 20.1 59.9 4 40 4Zm0 49.5A14.5 14.5 0 1 1 40 24a14.5 14.5 0 0 1 0 29.5Z"/>
          <circle class="pin-eye" cx="40" cy="39.5" r="13" fill="#06100e"/>
        </svg>
      </div>
      <div id="focalWord" class="focal-word" aria-live="polite"></div>
      <div id="overloadFlash" class="overload-flash" aria-hidden="true"></div>
    </section>

    <section id="answerScene" class="scene answer-scene" aria-label="A better way">
      <div id="answerCopy" class="answer-copy" aria-live="polite"></div>
    </section>

    <section id="resolveScene" class="scene resolve-scene" aria-hidden="true">
      <canvas id="cadCanvas" class="cad-canvas"></canvas>
      <div id="letterFlight" class="letter-flight"></div>
      <div id="brandResolve" class="brand-resolve">
        <div class="brand-energy"></div>
        <div id="wordmarkFrame" class="wordmark-frame">
          <img id="finalWordmark" class="final-wordmark" src="sami-wordmark.eb168c8e3c.png" alt="SAMI">
          <img class="wordmark-current current-upper" src="sami-wordmark.eb168c8e3c.png" alt="" aria-hidden="true">
          <img class="wordmark-current current-lower" src="sami-wordmark.eb168c8e3c.png" alt="" aria-hidden="true">
        </div>
        <p class="brand-tagline">SPATIAL ANALYSIS MAPPING INTELLIGENCE</p>
        <div class="welcome-actions">
          <button id="enterSami" class="primary-action" type="button"><span>Ask SAMI</span><small>Start planning</small></button>
          <button id="whySami" class="secondary-action" type="button">Why ask SAMI?</button>
        </div>
        <p class="brand-credit">JW EDS DESIGNS</p>
      </div>
    </section>

    <div id="filmProgress" class="film-progress" aria-hidden="true"><span></span></div>
    <audio id="launchBed" src="sami-intro.1c4c23273f.mp3" preload="auto"></audio>
  </main>
  <script src="launch-v103.js"></script>
</body>
</html>
